<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="/logo1.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>AP Solutions | Professional Web Development Agency</title>

    <meta
      name="description"
      content="AP Solutions helps startups and businesses build modern, responsive and high-performing websites."
    />

    <meta
      name="keywords"
      content="AP Solutions, Web Development, MERN Stack, WordPress, Shopify, Digital Agency"
    />

    <!-- Open Graph - WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AP Solutions" />

    <meta
      property="og:title"
      content="AP Solutions | Digital Agency"
    />

    <meta
      property="og:description"
      content="Building Modern Websites That Grow Your Business."
    />

    <meta
      property="og:url"
      content="https://apdigital.netlify.app/"
    />

    <meta
      property="og:image"
      content="https://apdigital.netlify.app/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="AP Solutions - Building Modern Websites That Grow Your Business"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="AP Solutions | Digital Agency"
    />

    <meta
      name="twitter:description"
      content="Building Modern Websites That Grow Your Business."
    />

    <meta
      name="twitter:image"
      content="https://apdigital.netlify.app/og-image.png"
    />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
