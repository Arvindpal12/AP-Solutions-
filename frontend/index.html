<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Website favicon -->
    <link rel="icon" type="image/png" href="/logo1.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Metadata -->
    <title>AP Solutions | Digital Agency</title>

    <meta
      name="description"
      content="AP Solutions helps startups and businesses build modern, responsive and high-performing websites."
    />

    <meta
      name="keywords"
      content="AP Solutions, Web Development, MERN Stack, WordPress, Shopify, Digital Agency"
    />

    <!-- Open Graph Metadata: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AP Solutions | Digital Agency" />

    <meta
      property="og:description"
      content="Building Modern Websites That Grow Your Business."
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="AP Solutions - Building Modern Websites That Grow Your Business"
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta property="og:site_name" content="AP Solutions" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="AP Solutions | Digital Agency"
    />

    <meta
      name="twitter:description"
      content="Building Modern Websites That Grow Your Business."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
